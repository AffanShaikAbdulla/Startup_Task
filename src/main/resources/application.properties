spring.application.name=Shipping_Services
# ===============================
# Spring Datasource Configuration
# ===============================

# JDBC URL pointing to the shipping_startup database
spring.datasource.url=jdbc:mysql://localhost:3306/shipping_startup
# Database credentials
spring.datasource.username=root
spring.datasource.password=ammu@2668

# Driver class name for MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate JPA Configuration
# ===============================
# Shipping rates
shipping.domestic.rate=200
shipping.international.rate=15

# Shipping currencies
shipping.domestic.currency=INR
shipping.international.currency=USD


# Dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Automatically update the schema (use with caution in production)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (good for debugging)
spring.jpa.show-sql=true

# Format SQL queries nicely in the console
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Settings (optional)
# ===============================

# Change server port if needed (default is 8080)
 server.port=8080

# ===============================
# Logging Configuration (optional)
# ===============================
